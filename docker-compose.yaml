services:
  mnemory:
    build: .
    container_name: mnemory
    ports:
      - "8050:8050"
      - "8051:8051"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MCP_API_KEY=${MCP_API_KEY}
      - MCP_API_KEYS=${MCP_API_KEYS}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
      - EMBED_BASE_URL=${EMBED_BASE_URL}
      - EMBED_MODEL=${EMBED_MODEL}
      - EMBED_DIMS=${EMBED_DIMS}
      - MGMT_PORT=8051
    volumes:
      - mnemory-data:/data
    networks:
      - default
      - ai-stack
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8051/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mnemory-backup:
    image: alpine:3.21
    container_name: mnemory-backup
    volumes:
      - mnemory-data:/data:ro
      - ./backups:/backups
      - ./backup/backup.sh:/scripts/backup.sh:ro
    environment:
      - BACKUP_DIR=/backups
      - DATA_DIR=/data
      - RETAIN_DAYS=${BACKUP_RETAIN_DAYS:-7}
      - BACKUP_CRON=${BACKUP_CRON:-0 2 * * *}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        chmod +x /scripts/backup.sh
        echo "$${BACKUP_CRON} /scripts/backup.sh >> /var/log/backup.log 2>&1" > /etc/crontabs/root
        echo "[$(date -u +%FT%TZ)] Backup scheduler started (cron: $${BACKUP_CRON}, retain: $${RETAIN_DAYS} days)"
        crond -f -l 2
    restart: unless-stopped

volumes:
  mnemory-data:

networks:
  default: {}
  ai-stack:
    external: true
    name: ai-stack_default

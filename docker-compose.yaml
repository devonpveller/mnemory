services:
  mnemory:
    build: .
    container_name: mnemory
    ports:
      - "8050:8050"
      - "8051:8051"
    environment:
      - LLM_API_KEY=ollama
      # - LLM_BASE_URL=http://openwebui:11434/v1
      # - LLM_BASE_URL=http://169.254.83.107:5506/v1
      - LLM_BASE_URL=http://llama-cpp-embed:8080/v1
      - LLM_MODEL=Qwen3.6-35B-A3B-Q4_K_M.gguf
      # - EMBED_BASE_URL=http://openwebui:11434/v1
      - EMBED_BASE_URL=http://llama-cpp-embed:8080/v1
      - EMBED_MODEL=qllama/bge-m3:latest
      - EMBED_DIMS=1024
      - MCP_API_KEY=${MCP_API_KEY}
      - MCP_API_KEYS=${MCP_API_KEYS}
      - FIND_LLM_MODEL=gpt-oss:20b
      - FIND_MEMORIES_QUERIES=3
      - LLM_CONTEXT_SIZE=8192
      - MGMT_PORT=8051
    volumes:
      - mnemory-data:/data
    networks:
      - default
      - ai-stack
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8051/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mnemory-backup:
    image: alpine:3.21
    container_name: mnemory-backup
    volumes:
      - mnemory-data:/data:ro
      - ./backups:/backups
      - ./backup/backup.sh:/scripts/backup.sh:ro
    environment:
      - BACKUP_DIR=/backups
      - DATA_DIR=/data
      - RETAIN_DAYS=${BACKUP_RETAIN_DAYS:-7}
      - BACKUP_CRON=${BACKUP_CRON:-0 2 * * *}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        chmod +x /scripts/backup.sh
        echo "$${BACKUP_CRON} /scripts/backup.sh >> /var/log/backup.log 2>&1" > /etc/crontabs/root
        echo "[$(date -u +%FT%TZ)] Backup scheduler started (cron: $${BACKUP_CRON}, retain: $${RETAIN_DAYS} days)"
        crond -f -l 2
    restart: unless-stopped

volumes:
  mnemory-data:

networks:
  default: {}
  ai-stack:
    external: true
    name: ai-stack_default
